# Publishes a prepared branch to its own repository.
#
# Push the full history of a project to a branch named publish/<repo> in this
# repository, then run this workflow with repo=<repo>. It creates
# osama-fattah/<repo> if it does not exist, fast-forwards its main branch to the
# prepared history (never force), waits for that repository's CI to finish
# (the run fails if CI fails), and deletes the publish/<repo> branch.
#
# Requires the PUBLISH_TOKEN secret: a fine-grained token with access to all
# repositories and Administration, Contents and Workflows read/write.
name: publish

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Target repository name (osama-fattah/<repo>)"
        required: true
      description:
        description: "Repository description, used only when creating it"
        required: false
        default: ""
      replace_sha:
        description: "One-off history rewrite: current main SHA to replace (force-with-lease)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.repo }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      OWNER: osama-fattah
      REPO: ${{ inputs.repo }}
      DESCRIPTION: ${{ inputs.description }}
      REPLACE_SHA: ${{ inputs.replace_sha }}
      GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
    steps:
      - name: Validate input
        run: |
          if [[ ! "$REPO" =~ ^[A-Za-z0-9._-]{1,100}$ || "$REPO" == "$OWNER" ]]; then
            echo "::error::invalid target repository name: $REPO"
            exit 1
          fi
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::PUBLISH_TOKEN secret is not set"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: publish/${{ inputs.repo }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create repository if missing
        run: |
          if gh repo view "$OWNER/$REPO" >/dev/null 2>&1; then
            echo "Repository $OWNER/$REPO exists"
          else
            gh repo create "$OWNER/$REPO" --public --description "$DESCRIPTION"
          fi

      - name: Refuse AI attribution in new commits
        run: |
          base=""
          if git fetch -q "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${REPO}.git" main 2>/dev/null; then
            base="FETCH_HEAD"
          fi
          range="${base:+$base..}HEAD"
          bad=$(git log --format='%H %an <%ae> | %cn <%ce>%n%B' "$range" \
            | grep -i -E 'anthropic|co-authored-by:.*claude|claude-session|generated with claude|^[0-9a-f]{40} claude ' || true)
          if [[ -n "$bad" ]]; then
            echo "::error::new commits credit Claude/AI; fix authors and messages before publishing"
            echo "$bad"
            exit 1
          fi

      - name: Fast-forward main
        run: |
          lease=()
          if [[ -n "$REPLACE_SHA" ]]; then
            [[ "$REPLACE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::replace_sha must be a full SHA"; exit 1; }
            lease=(--force-with-lease="main:${REPLACE_SHA}")
          fi
          git push "${lease[@]}" "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${REPO}.git" HEAD:refs/heads/main
          echo "Published $(git rev-parse --short HEAD) to https://github.com/${OWNER}/${REPO}" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for the target repository's CI
        run: |
          sha=$(git rev-parse HEAD)
          if [[ ! -d .github/workflows ]]; then
            echo "No workflows in $REPO; nothing to wait for" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for i in $(seq 1 60); do
            runs=$(gh run list -R "$OWNER/$REPO" --commit "$sha" --json status,conclusion,name \
              --jq 'map(select(.name != "publish"))')
            total=$(jq length <<<"$runs")
            pending=$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")
            if [[ "$total" -gt 0 && "$pending" -eq 0 ]]; then
              jq -r '.[] | "- \(.name): \(.conclusion)"' <<<"$runs" >> "$GITHUB_STEP_SUMMARY"
              failed=$(jq '[.[] | select(.conclusion != "success" and .conclusion != "skipped")] | length' <<<"$runs")
              [[ "$failed" -eq 0 ]] || { echo "::error::CI failed in $OWNER/$REPO for $sha"; exit 1; }
              exit 0
            fi
            sleep 15
          done
          echo "::error::timed out waiting for CI in $OWNER/$REPO"
          exit 1

      - name: Remove publish branch
        if: always()
        run: git push "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${OWNER}.git" --delete "publish/${REPO}"
